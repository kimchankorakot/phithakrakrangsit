<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พิทักษ์รักรังสิต · ระบบจัดการของบริจาค</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="wrap">
  <section class="hero" id="hero-section">
    <img class="hero-bg-photo" src="assets/club-photo.jpg" alt=""
         onload="document.getElementById('hero-section').classList.add('has-photo')"
         onerror="this.remove();">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-eyebrow" data-i18n="hero_eyebrow"></div>
      <h1 data-i18n="hero_title"></h1>
      <div class="hero-en" data-i18n="hero_en"></div>
      <p class="lede" data-i18n="hero_lede"></p>
      <a class="scroll-cue" href="#stat-section">
        <span class="arrow-circle">↓</span>
        <span data-i18n="scroll_cue"></span>
      </a>
    </div>
  </section>

  <section id="stat-section" class="stat-grid">
    <div class="stat-card">
      <div class="icon">📦</div>
      <div>
        <div class="stat-num" id="stat-delivered-num">-</div>
        <div class="stat-label" data-i18n="stat_items_delivered"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="icon">🏫</div>
      <div>
        <div class="stat-num" id="stat-places-num">-</div>
        <div class="stat-label" data-i18n="stat_places"></div>
      </div>
    </div>
    <div class="stat-card" id="member-stat-card">
      <div class="icon">🙋</div>
      <div>
        <div class="stat-num" id="stat-members-num">-</div>
        <div class="stat-label" data-i18n="stat_members"></div>
      </div>
      <div class="stat-edit-form" id="member-edit-form">
        <input type="number" min="0" id="member-edit-input">
        <button class="btn btn-primary btn-sm" id="member-save-btn" data-i18n="save"></button>
        <button class="btn btn-ghost btn-sm" id="member-cancel-btn" data-i18n="cancel"></button>
      </div>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="members-box">
      <div class="section-title" style="margin-bottom:10px;">
        <h2 style="font-size:1.15rem;" data-i18n="process_title"></h2>
      </div>
      <p class="lede" style="margin:0 0 18px; font-size:0.92rem;" data-i18n="process_lede"></p>
      <div class="process-flow" id="process-flow"><div class="process-rail"></div></div>
      <div class="process-detail" id="process-detail"></div>
    </div>
  </section>

  <hr class="section-divider">

  <section>
    <div class="section-title">
      <h2 data-i18n="drives_title"></h2>
      <a class="see-all" href="timeline.html" data-i18n="see_all"></a>
    </div>
    <p class="lede" data-i18n="drives_lede" style="margin-top:-14px;"></p>
    <div id="admin-add-drive"></div>
    <div id="drives-list"><div class="empty-state">...</div></div>
  </section>

  <hr class="section-divider">

  <section>
    <div class="photo-block" id="donation-photo-block">
      <img src="assets/donation-photo.jpg" alt="ภาพการส่งมอบและบริจาค"
           onerror="document.getElementById('donation-photo-block').outerHTML = '<div class=&quot;photo-placeholder&quot; style=&quot;background: linear-gradient(135deg, var(--rust) 0%, var(--slate) 100%);&quot;><div class=&quot;ph-icon&quot;>🤝</div><div class=&quot;ph-label&quot; data-i18n=&quot;ph_donation_label&quot;></div></div>'; applyLang();">
    </div>
  </section>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderHeader('home');
  renderFooter();
  const isAdmin = !!getAdminToken();

  /* ---------------- Process flow (5 steps) ---------------- */
  let activeStep = 0;
  function renderProcessFlow(){
    const steps = getProcessSteps();
    const flowEl = document.getElementById('process-flow');
    flowEl.innerHTML = `<div class="process-rail"></div>` + steps.map((s,i)=>`
      <button class="process-step ${i===activeStep?'on':''}" data-step="${i}">
        <span class="num-circle">${i+1}</span>
        <span class="step-label">${s.label}</span>
      </button>`).join('');
    flowEl.querySelectorAll('[data-step]').forEach(b=>{
      b.addEventListener('click', ()=>{ activeStep = Number(b.dataset.step); renderProcessFlow(); renderProcessDetail(); });
    });
  }
  function renderProcessDetail(){
    const steps = getProcessSteps();
    const s = steps[activeStep];
    const bullets = s.bullets ? `<ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : '';
    document.getElementById('process-detail').innerHTML = `<h3>${String(activeStep+1).padStart(2,'0')} · ${s.title}</h3><p>${s.desc}</p>${bullets}`;
  }
  function onLangChange(){ renderProcessFlow(); renderProcessDetail(); }
  renderProcessFlow();
  renderProcessDetail();

  /* ---------------- Donation drives (compact + expandable) ---------------- */
  function driveCard(d){
    return `<div class="drive-card">
      ${isAdmin ? `<button class="btn btn-outline btn-sm drive-edit" data-edit="${d.id}" data-i18n="edit"></button>` : ''}
      <div class="drive-summary">
        <div class="drive-item">${d.itemType || ''}</div>
        <button class="btn btn-ghost btn-sm" data-toggle-details="${d.id}" data-i18n="view_details"></button>
      </div>
      <div class="drive-details" id="details-${d.id}">
        <div class="drive-row"><b data-i18n="f_dateRange"></b>: ${d.dateStart || ''} – ${d.dateEnd || ''}</div>
        <div class="drive-row"><b data-i18n="f_location"></b>: ${d.location || ''}</div>
        <div class="drive-row"><b data-i18n="f_hours"></b>: ${d.hours || ''}</div>
      </div>
      <div class="edit-form sub-form" id="edit-form-${d.id}">
        <div class="field"><label data-i18n="f_itemType"></label><input class="e-itemType" value="${d.itemType||''}"></div>
        <div class="field"><label data-i18n="f_dateRange"></label>
          <div style="display:flex; gap:8px;"><input class="e-start" value="${d.dateStart||''}"><input class="e-end" value="${d.dateEnd||''}"></div>
        </div>
        <div class="field"><label data-i18n="f_location"></label><input class="e-location" value="${d.location||''}"></div>
        <div class="field"><label data-i18n="f_hours"></label><input class="e-hours" value="${d.hours||''}"></div>
        <button class="btn btn-primary btn-sm" data-save="${d.id}" data-i18n="save"></button>
        <button class="btn btn-ghost btn-sm" data-cancel="${d.id}" data-i18n="cancel"></button>
      </div>
    </div>`;
  }

  async function loadDrives(){
    const res = await apiGet('getDrives', {});
    const drives = (res && res.data) || [];
    const el = document.getElementById('drives-list');
    if(drives.length === 0){ el.innerHTML = `<div class="empty-state" data-i18n="empty_drives"></div>`; applyLang(); return; }
    el.innerHTML = drives.map(driveCard).join('');
    applyLang();
    el.querySelectorAll('[data-toggle-details]').forEach(b=> b.addEventListener('click', ()=>{
      document.getElementById('details-'+b.dataset.toggleDetails).classList.toggle('open');
    }));
    el.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
      document.getElementById('edit-form-'+b.dataset.edit).classList.toggle('open');
    }));
    el.querySelectorAll('[data-cancel]').forEach(b=> b.addEventListener('click', ()=>{
      document.getElementById('edit-form-'+b.dataset.cancel).classList.remove('open');
    }));
    el.querySelectorAll('[data-save]').forEach(b=> b.addEventListener('click', async ()=>{
      const id = b.dataset.save;
      const form = document.getElementById('edit-form-'+id);
      showToast(t('saving'));
      await apiPost('updateDrive', {
        driveId: id,
        itemType: form.querySelector('.e-itemType').value,
        dateStart: form.querySelector('.e-start').value,
        dateEnd: form.querySelector('.e-end').value,
        location: form.querySelector('.e-location').value,
        hours: form.querySelector('.e-hours').value,
      });
      showToast(t('saved'));
      loadDrives();
    }));
  }

  if(isAdmin){
    document.getElementById('admin-add-drive').innerHTML = `
      <button class="add-inline-btn" id="add-drive-btn" data-i18n="add_drive"></button>
      <div class="card sub-form" id="add-drive-form" style="margin-bottom:16px;">
        <div class="field"><label data-i18n="f_itemType"></label><input id="nd-itemType"></div>
        <div class="field"><label data-i18n="f_dateRange"></label>
          <div style="display:flex; gap:8px;"><input id="nd-start" placeholder="24/06/2569"><input id="nd-end" placeholder="24/07/2569"></div>
        </div>
        <div class="field"><label data-i18n="f_location"></label><input id="nd-location"></div>
        <div class="field"><label data-i18n="f_hours"></label><input id="nd-hours"></div>
        <button class="btn btn-primary btn-sm" id="nd-save" data-i18n="save"></button>
      </div>`;
    applyLang();
    document.getElementById('add-drive-btn').addEventListener('click', ()=>{
      document.getElementById('add-drive-form').classList.toggle('open');
    });
    document.getElementById('nd-save').addEventListener('click', async ()=>{
      showToast(t('saving'));
      await apiPost('addDrive', {
        itemType: document.getElementById('nd-itemType').value,
        dateStart: document.getElementById('nd-start').value,
        dateEnd: document.getElementById('nd-end').value,
        location: document.getElementById('nd-location').value,
        hours: document.getElementById('nd-hours').value,
      });
      showToast(t('saved'));
      document.getElementById('add-drive-form').classList.remove('open');
      loadDrives();
    });
  }

  async function load(){
    loadDrives();

    const stats = await apiGet('getStats');
    if(stats && stats.data){
      document.getElementById('stat-delivered-num').textContent = stats.data.itemsDelivered ?? '-';
      document.getElementById('stat-places-num').textContent = stats.data.placesContacted ?? '-';
      document.getElementById('stat-members-num').textContent = stats.data.memberCount ?? '21';
    }
  }
  load();

  /* ---------------- Member count (admin-editable) ---------------- */
  if(isAdmin){
    const card = document.getElementById('member-stat-card');
    const editBtn = document.createElement('button');
    editBtn.className = 'stat-edit-btn';
    editBtn.textContent = '✎';
    editBtn.setAttribute('aria-label', t('edit'));
    card.appendChild(editBtn);
    const form = document.getElementById('member-edit-form');
    editBtn.addEventListener('click', ()=>{
      document.getElementById('member-edit-input').value = document.getElementById('stat-members-num').textContent;
      form.classList.add('open');
    });
    document.getElementById('member-cancel-btn').addEventListener('click', ()=> form.classList.remove('open'));
    document.getElementById('member-save-btn').addEventListener('click', async ()=>{
      const val = document.getElementById('member-edit-input').value;
      showToast(t('saving'));
      await apiPost('updateMemberCount', { memberCount: val });
      document.getElementById('stat-members-num').textContent = val;
      showToast(t('saved'));
      form.classList.remove('open');
    });
  }
</script>
</body>
</html>
