<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบหลังบ้าน — พิทักษ์รักษ์รังสิต</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="wrap" style="display:flex; align-items:center; justify-content:center; min-height:70vh;">
  <div class="card" style="max-width:380px; width:100%;">
    <h1 style="font-size:1.4rem; text-align:center;" data-i18n="login_title"></h1>
    <p class="lede" data-i18n="login_lede" style="margin-bottom:24px; text-align:center;"></p>

    <form id="login-form">
      <div class="field"><label data-i18n="f_nickname"></label><input id="lg-name"></div>
      <div class="field"><label data-i18n="f_password"></label><input id="lg-password" type="password" required></div>
      <button class="btn btn-primary" type="submit" style="width:100%;" data-i18n="nav_login"></button>
    </form>
  </div>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
  renderHeader('');
  renderFooter();

  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    const res = await apiPost('login', { password: document.getElementById('lg-password').value });
    submitBtn.disabled = false;
    if(res && res.ok && res.token){
      const name = document.getElementById('lg-name').value.trim() || 'เจ้าหน้าที่';
      setAdminSession(res.token, { name });
      window.location.href = 'index.html';
    } else {
      showToast(t('login_denied'));
    }
  });
</script>
</body>
</html>
